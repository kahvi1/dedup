<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Dedup</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">

  <script src="renderer.js"></script>

</html>
